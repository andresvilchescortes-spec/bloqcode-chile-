<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor Básico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: #f3f4f6; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -10px; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #374151; border-radius: 4px; }
        input[type=range]:focus { outline: none; }
        .highlight-text { background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="w-full max-w-lg bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-10 border border-gray-700">
        <h1 class="text-3xl font-extrabold mb-8 text-center highlight-text">Medidor Básico</h1>
        
        <div class="space-y-8">
            <!-- Pregunta 1: Agradabilidad -->
            <div>
                <label class="block text-lg font-medium text-gray-200 mb-4">1. Lo que siento es agradable</label>
                <div class="flex items-center gap-4">
                    <span class="text-xs text-gray-500 font-bold w-20">Desacuerdo</span>
                    <input type="range" id="q-placer" min="1" max="10" value="5" class="flex-grow" oninput="document.getElementById('val-p').innerText = this.value">
                    <span class="text-xs text-gray-500 font-bold w-20 text-right">Acuerdo (<span id="val-p" class="text-blue-400">5</span>)</span>
                </div>
            </div>

            <!-- Pregunta 2: Energía -->
            <div>
                <label class="block text-lg font-medium text-gray-200 mb-4">2. Siento mucha energía</label>
                <div class="flex items-center gap-4">
                    <span class="text-xs text-gray-500 font-bold w-20">Desacuerdo</span>
                    <input type="range" id="q-energia" min="1" max="10" value="5" class="flex-grow" oninput="document.getElementById('val-e').innerText = this.value">
                    <span class="text-xs text-gray-500 font-bold w-20 text-right">Acuerdo (<span id="val-e" class="text-blue-400">5</span>)</span>
                </div>
            </div>

            <!-- Botón VER -->
            <div class="pt-4 flex justify-center">
                <button onclick="calcularBasico()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-12 rounded-xl transition duration-300 shadow-lg hover:shadow-blue-500/50 text-xl tracking-widest">
                    VER
                </button>
            </div>

            <!-- Resultado -->
            <div class="pt-6 border-t border-gray-700 mt-6 text-center">
                <p class="text-gray-400 text-lg mb-2">Tu estado emocional es:</p>
                <div class="bg-gray-900 border-2 border-gray-600 rounded-xl p-4 min-h-[80px] flex items-center justify-center">
                    <span id="resultado-texto" class="text-3xl font-bold text-white capitalize">---</span>
                </div>
            </div>
            
            <div class="text-center mt-6">
                <a href="medidor-emociones.html" class="text-sm text-gray-500 hover:text-blue-400 underline transition">Volver al Test Completo</a>
            </div>
        </div>
    </div>

    <script>
        const emotionMatrix = [
            ["Violento", "En pánico", "Estresado", "Agitado", "En shock", "Sorprendido", "Alegre", "Contento", "Jubiloso", "Eufórico"],
            ["Colérico", "Furioso", "Frustrado", "Tenso", "Aturdido", "Desmadrado", "De buen humor", "Motivado", "Inspirado", "Jovial"],
            ["Humeante", "Asustado", "Enojado", "Nervioso", "Impaciente", "Dinámico", "Animado", "Entusiasmado", "Optimista", "Alborotado"],
            ["Ansioso", "Aprensivo", "Preocupado", "Irritado", "Molesto", "Satisfecho", "Feliz", "Concentrado", "Orgulloso", "Emocionado"],
            ["Rechazado", "Inseguro", "Intranquilo", "Inquieto", "Fastidiado", "Agradable", "Placentero", "Esperanzado", "Juguetona", "Dichoso"],
            ["Asqueado", "Sombrío", "Decepcionado", "De bajón", "Apático", "Tranquilo", "De trato fácil", "Conforme", "Cariñosa", "Realizado"],
            ["Pesimista", "Malhumorado", "Desanimado", "Triste", "Aburrido", "Calmado", "Seguro", "Satisfecho", "Agradecido", "Conmovido"],
            ["Enajenado", "Miserable", "Solitario", "Apagado", "Cansado", "Relajado", "Apacible", "Reposado", "Afortunado", "Equilibrado"],
            ["Afligido", "Deprimido", "Taciturno", "Exhausto", "Fatigado", "Sosegado", "Amable", "Pacífico", "Cómodo", "Desenfadado"],
            ["Desesperado", "Desmoralizado", "Desolado", "Agotado", "Abatido", "Soñoliento", "Satisfecho", "Sereno", "Amigable", "Plácido"]
        ];

        function calcularBasico() {
            let valPlacer = parseInt(document.getElementById('q-placer').value);
            let valEnergia = parseInt(document.getElementById('q-energia').value);

            // Cálculo directo de 1-10 a coordenadas de matriz 0-9
            let x = valPlacer - 1;
            let y = 10 - valEnergia;

            document.getElementById('resultado-texto').innerText = emotionMatrix[y][x];
            
            // Animación sutil de actualización
            const res = document.getElementById('resultado-texto');
            res.style.opacity = '0';
            setTimeout(() => { res.style.opacity = '1'; res.style.transition = 'opacity 0.3s ease'; }, 50);
        }
    </script>
</body>
</html>
